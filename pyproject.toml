[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "project-atready"
version = "0.1.9"
description = "Resource-fit evidence for plans using declared tools, credits, agents, and people"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "stoicpickle" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["codex", "planning", "tool-routing", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
atready = "atready.cli:main"

[project.urls]
Homepage = "https://github.com/stoicpickle/atready"
Documentation = "https://github.com/stoicpickle/atready/tree/main/docs"
Repository = "https://github.com/stoicpickle/atready"
Issues = "https://github.com/stoicpickle/atready/issues"
Support = "https://github.com/stoicpickle/atready/blob/main/SUPPORT.md"
Security = "https://github.com/stoicpickle/atready/security/policy"
Privacy = "https://github.com/stoicpickle/atready/blob/main/PRIVACY.md"
Terms = "https://github.com/stoicpickle/atready/blob/main/TERMS.md"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.135,<7",
  "pillow==12.3.0",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
elevated = [
  "mutmut>=3.3,<4",
]
release = [
  "readme-renderer[md]>=45,<46",
  "twine>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atready"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/atready/skills/project-atready" = "atready/bundled_skill"

[tool.hatch.build.targets.sdist]
include = [
  "/PRIVACY.md",
  "/TERMS.md",
  "/src/atready",
  "/plugins/atready/skills/project-atready",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/atready/"]
only_mutate = ["src/atready/routing.py"]
also_copy = ["evals/fixtures/"]
pytest_add_cli_args_test_selection = [
  "tests/test_routing.py",
  "tests/test_routing_stress.py",
  "tests/test_routing_properties.py",
]

[tool.coverage.run]
branch = true
source = ["atready"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S101"]
