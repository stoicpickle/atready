name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          prune-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --no-group release --no-install-project

      - name: Validate plugin and skill contracts
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_plugin_contract.py tests/test_skill_contract.py

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        if: runner.os != 'Linux'
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest

      - name: Test with branch coverage
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest --cov=atready --cov-report=term-missing

      - name: Build distributions
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: ""
          UV_NO_CONFIG: "1"
        run: >-
          uv build --clear --no-create-gitignore --no-sources
          --build-constraints build-constraints.txt --require-hashes
          --default-index https://pypi.org/simple

      - name: Install locked release checks
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: ""
          UV_NO_CONFIG: "1"
        run: uv sync --locked --all-groups --no-install-project

      - name: Check PyPI metadata and rendering
        run: uv run --no-sync twine check --strict dist/*

      - name: Verify rendered README links
        run: uv run --no-sync python scripts/verify_readme_rendering.py

      - name: Verify exact artifact contents
        run: uv run --no-sync python scripts/verify_release_artifacts.py --dist dist

      - name: Smoke installed wheel
        run: >-
          uv run --isolated --no-project
          --with ./dist/project_atready-0.1.7-py3-none-any.whl
          python scripts/smoke_wheel.py

      - name: Prove clean source and wheel first use
        if: matrix.python == '3.11'
        run: >-
          uv run --no-sync python scripts/hardening_gate.py
          --wheel ./dist/project_atready-0.1.7-py3-none-any.whl

      - name: Smoke staged plugin
        run: >-
          uv run --isolated --no-project
          --with ./dist/project_atready-0.1.7-py3-none-any.whl
          python scripts/smoke_plugin.py
