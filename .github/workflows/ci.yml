name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          prune-cache: true

      - name: Install locked dependencies
        run: >-
          uv sync --locked --all-groups --no-group release --no-group elevated
          --no-install-project

      - name: Validate plugin and skill contracts
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_plugin_contract.py tests/test_skill_contract.py

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest

      - name: Windows tests 1 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_beta_setup.py
          tests/test_beta_start_here.py
          tests/test_bundled_kernel_spike.py
          tests/test_capacity_routing.py
          tests/test_catalog.py
          tests/test_clean_first_use.py
          tests/test_cli.py
          tests/test_cli_screenshot.py

      - name: Windows tests 2 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_conversation_hardening_scorecard.py
          tests/test_decision_change_benchmark.py
          tests/test_demo_flow_cli.py
          tests/test_elevated_install_matrix.py
          tests/test_evals.py
          tests/test_first_user_acceptance.py
          tests/test_fresh_host_conversation_matrix.py
          tests/test_fsprivacy.py

      - name: Windows tests 3 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_guided_plan_cli.py
          tests/test_hardening_gate.py
          tests/test_intake.py
          tests/test_inventory_edit.py
          tests/test_issue_forms.py
          tests/test_local_state_adversarial.py
          tests/test_model_behavior_scorecard.py
          tests/test_nonce_clone_contract.py

      - name: Windows tests 4 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_paths.py
          tests/test_perishable_capacity.py
          tests/test_plan_communication_eval_contract.py
          tests/test_plugin_contract.py
          tests/test_plugin_submission_bundle.py
          tests/test_plugin_surface_probe.py
          tests/test_plugin_validator_contract.py
          tests/test_project.py

      - name: Windows tests 5 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_project_json_line_pty.py
          tests/test_public_copy_style.py
          tests/test_public_hardening_coverage.py
          tests/test_public_onboarding_copy.py
          tests/test_quick_setup.py
          tests/test_readme_rendering.py
          tests/test_release_artifacts.py
          tests/test_release_bundle.py

      - name: Windows tests 6 of 7
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest
          tests/test_release_workflow.py
          tests/test_render.py
          tests/test_resource_input.py
          tests/test_resource_intake_eval_contract.py
          tests/test_resource_state.py
          tests/test_resource_state_cli_integration.py
          tests/test_route_comparison.py
          tests/test_routing.py

      - name: Windows routing property tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_routing_properties.py

      - name: Windows routing stress tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_routing_stress.py

      - name: Windows runtime contract tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_runtime_contract.py

      - name: Windows skill contract tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_skill_contract.py

      - name: Windows YAML input tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest tests/test_yamlio.py

      - name: Test with branch coverage
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest --cov=atready --cov-report=term-missing

      - name: Build distributions
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: ""
          UV_NO_CONFIG: "1"
        run: >-
          uv build --clear --no-create-gitignore --no-sources
          --build-constraints build-constraints.txt --require-hashes
          --default-index https://pypi.org/simple

      - name: Install locked release checks
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX: ""
          UV_NO_CONFIG: "1"
        run: uv sync --locked --all-groups --no-group elevated --no-install-project

      - name: Check PyPI metadata and rendering
        run: uv run --no-sync twine check --strict dist/*

      - name: Verify rendered README links
        run: uv run --no-sync python scripts/verify_readme_rendering.py

      - name: Verify exact artifact contents
        run: uv run --no-sync python scripts/verify_release_artifacts.py --dist dist

      - name: Smoke installed wheel
        run: >-
          uv run --isolated --no-project
          --with ./dist/project_atready-0.1.10-py3-none-any.whl
          python scripts/smoke_wheel.py

      - name: Prove clean source and wheel first use
        if: matrix.python == '3.11'
        run: >-
          uv run --no-sync python scripts/hardening_gate.py
          --wheel ./dist/project_atready-0.1.10-py3-none-any.whl

      - name: Smoke staged plugin
        run: >-
          uv run --isolated --no-project
          --with ./dist/project_atready-0.1.10-py3-none-any.whl
          python scripts/smoke_plugin.py
