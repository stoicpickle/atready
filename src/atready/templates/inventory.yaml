      status: active
      interaction: local-cli
      current_session: available
    economics:
      billing: owned
      marginal_cost: 0.05
      quota: ample
    ratings:
      quality: 0.80
      speed: 0.80
      autonomy: 0.85
      privacy: 0.95
      reliability: 0.80
      confidence: 0.70
      context_switch_cost: 0.10
      integration_friction: 0.10
    policy:
      allowed_data_classes: [public, internal, private]
      approval_required: true
    provenance:
      basis: user-judgment
      last_verified: {{TODAY}}
